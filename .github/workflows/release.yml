name: Release Verdaccio Charts

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'charts/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Requires manual approval (verdacciobot) via the `charts` environment
    # before the Helm charts are released.
    environment: charts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "verdacciopack"
          git config user.email "verdacciobot@gmail.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.4.0

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          version: v1.8.1
          install_only: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and publish chart
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail

          owner=$(cut -d '/' -f 1 <<< "$GITHUB_REPOSITORY")
          repo=$(cut -d '/' -f 2 <<< "$GITHUB_REPOSITORY")
          chart="charts/verdaccio"
          chart_version=$(awk '/^version:/ { print $2; exit }' "$chart/Chart.yaml")
          release="verdaccio-${chart_version}"
          asset=".cr-release-packages/verdaccio-${chart_version}.tgz"
          notes=$(awk -F': ' '/^description:/ { print $2; exit }' "$chart/Chart.yaml")

          rm -rf .cr-release-packages .cr-index
          mkdir -p .cr-release-packages .cr-index

          cr package "$chart" --package-path .cr-release-packages

          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release already exists; skipping release creation."
          else
            gh release create "$release" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release" \
              --notes "$notes" \
              --latest
          fi

          cr index -o "$owner" -r "$repo" --push
